name: Build Windows Package

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Install packaging dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          $requirements = Get-Content requirements.txt | Where-Object {
            $_ -notmatch '^\s*paddleocr\s*'
          }
          $requirements | Set-Content "$env:RUNNER_TEMP\requirements-packaging.txt"
          python -m pip install -r "$env:RUNNER_TEMP\requirements-packaging.txt"
          python -m pip install pyinstaller

      - name: Build single-file executable
        run: pyinstaller --clean --noconfirm chaoxing.spec

      - name: Smoke test executable
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "dist\chaoxing-fanya.exe" -PassThru
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              Start-Sleep -Seconds 1
              try {
                $response = Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:5000/" -TimeoutSec 2
                if ($response.StatusCode -eq 200) {
                  $ready = $true
                  break
                }
              } catch {
                # The server may need a few seconds to unpack the one-file executable.
              }
            }
            if (-not $ready) {
              throw "Packaged executable did not serve http://127.0.0.1:5000/"
            }
          } finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }

      - name: Assemble release archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item "dist\chaoxing-fanya.exe" "release\chaoxing-fanya.exe"
          Copy-Item README.md release\README.md
          Compress-Archive -Path "release\*" -DestinationPath "release\chaoxing-fanya-windows-x64.zip" -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: chaoxing-fanya-windows-x64
          path: release\chaoxing-fanya-windows-x64.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/chaoxing-fanya-windows-x64.zip
