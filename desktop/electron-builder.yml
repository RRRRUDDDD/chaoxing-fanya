appId: com.chaoxing.fanya
productName: 超星泛雅刷课助手
directories:
  output: release
files:
  - main.js
  - package.json
extraResources:
  - from: backend/chaoxing-backend
    to: backend
win:
  target:
    - target: nsis
    - target: portable
  icon: build/icon.png
nsis:
  oneClick: true
  artifactName: chaoxing-fanya-desktop-setup-${version}.${ext}
  deleteAppDataOnUninstall: false
portable:
  artifactName: chaoxing-fanya-desktop-portable-${version}.${ext}
